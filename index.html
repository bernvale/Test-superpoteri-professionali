<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Quale Supereroe Sei? — Quiz</title>
<meta name="description" content="Scopri quale supereroe ti rappresenta rispondendo a 12 domande.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0B0B10;
    --paper:#F5F1E6;
    --yellow:#FFC93C;
    --red:#E63946;
    --blue:#3A86FF;
    --purple:#7B2CBF;
    --line: 4px;
    --radius: 14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background-color: var(--ink);
    background-image:
      radial-gradient(rgba(245,241,230,0.08) 1px, transparent 1px);
    background-size: 14px 14px;
    font-family:'Space Grotesk', system-ui, -apple-system, sans-serif;
    color: var(--ink);
    display:flex;
    flex-direction: column;
    align-items:center;
    justify-content:center;
    padding: 20px;
    gap: 4px;
  }
  .stage{
    width:100%;
    max-width: 480px;
  }
  .panel{
    background: var(--paper);
    border: var(--line) solid var(--ink);
    border-radius: var(--radius);
    box-shadow: 8px 8px 0 var(--ink);
    padding: 28px 22px;
    position: relative;
    overflow: hidden;
  }
  .halftone-corner{
    position:absolute;
    top:-40px; right:-40px;
    width:140px; height:140px;
    background-image: radial-gradient(var(--ink) 3px, transparent 3.2px);
    background-size: 14px 14px;
    opacity:0.12;
    border-radius:50%;
    pointer-events:none;
  }
  h1,h2,h3{
    font-family:'Bangers', cursive;
    letter-spacing: 0.5px;
    margin:0 0 6px;
    line-height:1.05;
  }
  .eyebrow{
    display:inline-block;
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    background: var(--red);
    color: var(--paper);
    border: 2px solid var(--ink);
    border-radius: 999px;
    padding: 4px 12px;
    transform: rotate(-2deg);
    margin-bottom: 14px;
  }

  /* ---------- INTRO ---------- */
  #screen-intro h1{
    font-size: 44px;
    color: var(--ink);
    text-shadow: 3px 3px 0 var(--yellow);
    margin-bottom: 10px;
  }
  #screen-intro p{
    font-size: 15px;
    line-height:1.5;
    margin: 0 0 22px;
    opacity:0.85;
  }
  .hero-strip{
    display:flex;
    gap:8px;
    font-size: 30px;
    margin-bottom: 22px;
  }
  .hero-strip span{
    background: var(--paper);
    border:3px solid var(--ink);
    border-radius: 10px;
    width: 52px;
    height: 52px;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow: 3px 3px 0 var(--ink);
  }

  /* ---------- BUTTONS ---------- */
  .btn{
    font-family:'Bangers', cursive;
    font-size: 22px;
    letter-spacing: 1px;
    color: var(--ink);
    background: var(--yellow);
    border: var(--line) solid var(--ink);
    border-radius: 10px;
    padding: 14px 20px;
    width: 100%;
    cursor: pointer;
    box-shadow: 5px 5px 0 var(--ink);
    transition: transform 0.08s ease, box-shadow 0.08s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .btn:active{
    transform: translate(4px,4px);
    box-shadow: 1px 1px 0 var(--ink);
  }
  .btn:focus-visible{
    outline: 3px solid var(--blue);
    outline-offset: 3px;
  }
  .btn-secondary{
    background: var(--paper);
  }

  /* ---------- QUIZ ---------- */
  #screen-quiz{ display:none; }
  .progress-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom: 18px;
  }
  .progress-track{
    flex:1;
    height: 14px;
    background: var(--paper);
    border: 3px solid var(--ink);
    border-radius: 999px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background: repeating-linear-gradient(
      45deg,
      var(--red), var(--red) 8px,
      var(--yellow) 8px, var(--yellow) 16px
    );
    width: 0%;
    transition: width 0.35s ease;
  }
  .progress-label{
    font-weight:700;
    font-size: 13px;
    white-space:nowrap;
  }
  .question-text{
    font-family:'Bangers', cursive;
    font-size: 26px;
    line-height:1.15;
    margin: 4px 0 18px;
  }
  .options{
    display:flex;
